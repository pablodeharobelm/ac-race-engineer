services:
  postgres:
    image: postgres:18-alpine
    container_name: ac-race-postgres

    environment:
      POSTGRES_DB: ac_race_engineer
      POSTGRES_USER: ac_race
      POSTGRES_PASSWORD: ac_race_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ac_race -d ac_race_engineer"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - ac-race-network


volumes:
  postgres_data:


networks:
  ac-race-network:
    name: ac-race-network