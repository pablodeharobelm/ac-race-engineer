[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ac-race-engineer"
version = "0.1.0"
description = "Telemetry, vehicle dynamics and AI race engineering platform for Assetto Corsa"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0,<3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"