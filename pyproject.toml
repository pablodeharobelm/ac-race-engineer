[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ac-race-engineer"
version = "0.1.0"
description = "Telemetry, vehicle dynamics and AI race engineering platform for Assetto Corsa"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0,<3.0",
    "pyarrow>=15.0",
    "tzdata>=2025.2",
    "pyarrow>=18.0",
    "pyspark[sql]>=4.2,<4.3",
    "pandas>=2.2,<3.0",
    "confluent-kafka>=2.15,<3",
    "matplotlib>=3.9,<4.0",
    "scikit-learn>=1.9,<2.0",
    "sqlalchemy>=2.0.54,<2.1",
    "alembic>=1.20,<1.21",
    "psycopg[binary]>=3.3,<4",
    "joblib>=1.4"
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.15,<3"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["kafka_integration: requires an external Kafka broker and the Spark Kafka connector"]

[tool.ruff]
line-length = 100
target-version = "py310"